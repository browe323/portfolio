name: portfolio-prod

services:
  web:
    image: ${IMAGE_REF:?IMAGE_REF must be set to an immutable image reference}
    env_file:
      - .env.prod
    networks:
      - shared_net
    labels:
      traefik.enable: "true"
      traefik.http.routers.portfolio-prod.rule: "Host(`portfolio.pencilcaselamp.net.im`)"
      traefik.http.routers.portfolio-prod.entrypoints: "web"
      traefik.http.services.portfolio-prod.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  shared_net:
    external: true
