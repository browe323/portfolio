name: Deploy to Test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portfolio:test

      - name: Authenticate runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Configure pinned SSH credentials
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}' > ~/.ssh/portfolio-deploy
          chmod 600 ~/.ssh/portfolio-deploy
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy test Compose file
        shell: bash
        run: |
          scp -i ~/.ssh/portfolio-deploy docker-compose.test.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/apps/portfolio/docker-compose.test.yml"

      - name: Deploy immutable test image
        shell: bash
        run: |
          ssh -i ~/.ssh/portfolio-deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/apps/portfolio && IMAGE_REF=ghcr.io/${{ github.repository_owner }}/portfolio:${{ github.sha }} docker compose --env-file .env.test -f docker-compose.test.yml pull && IMAGE_REF=ghcr.io/${{ github.repository_owner }}/portfolio:${{ github.sha }} docker compose --env-file .env.test -f docker-compose.test.yml up -d --remove-orphans"
